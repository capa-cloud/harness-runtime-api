openapi: 3.1.0
info:
  title: Harness Runtime API
  version: 0.1.0
  description: Provider-neutral control and event protocol for AI agent harness runtimes.
servers:
  - url: http://127.0.0.1:4310
paths:
  /healthz:
    get:
      operationId: health
      responses:
        "200":
          description: Service is ready.
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: ok
  /v1/runtime:
    get:
      operationId: describeRuntime
      responses:
        "200":
          description: Runtime identity and installed providers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeDescription"
  /v1/runtime/capabilities:
    get:
      operationId: listCapabilities
      responses:
        "200":
          description: Provider capability manifests.
          content:
            application/json:
              schema:
                type: object
                required:
                  - providers
                properties:
                  providers:
                    type: array
                    items:
                      $ref: "#/components/schemas/ProviderManifest"
  /v1/conversations:
    post:
      operationId: createConversation
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateConversationRequest"
      responses:
        "201":
          description: Conversation created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "400":
          $ref: "#/components/responses/Problem"
  /v1/conversations/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getConversation
      responses:
        "200":
          description: Conversation found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/executions:
    post:
      operationId: startExecution
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartExecutionRequest"
      responses:
        "202":
          description: Execution accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Execution"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /v1/executions/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getExecution
      responses:
        "200":
          description: Execution found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Execution"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/executions/{id}/artifacts:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: listArtifacts
      responses:
        "200":
          description: Portable artifact descriptors emitted by the execution.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactList"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/executions/{id}:cancel:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: cancelExecution
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelExecutionRequest"
      responses:
        "200":
          description: Current execution state after cancellation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Execution"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/executions/{id}/events:
    parameters:
      - $ref: "#/components/parameters/Id"
      - name: after
        in: query
        description: Return events with a sequence greater than this cursor.
        schema:
          type: integer
          minimum: 0
          maximum: 9007199254740991
          default: 0
    get:
      operationId: listOrStreamEvents
      responses:
        "200":
          description: JSON replay or an SSE stream, selected with the Accept header.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventList"
            text/event-stream:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/executions/{id}/actions/{actionId}:respond:
    parameters:
      - $ref: "#/components/parameters/Id"
      - name: actionId
        in: path
        required: true
        schema:
          type: string
          minLength: 1
    post:
      operationId: respondToAction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActionResponse"
      responses:
        "200":
          description: Execution resumed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Execution"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
  responses:
    Problem:
      description: Protocol error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    ActionKind:
      type: string
      enum:
        - approval
        - input
    ActionRequest:
      type: object
      properties:
        id:
          type: string
          minLength: 1
        executionId:
          type: string
          minLength: 1
        kind:
          $ref: "#/components/schemas/ActionKind"
        title:
          type: string
          minLength: 1
        description:
          type: string
        payload:
          $ref: "#/components/schemas/JsonObject"
        createdAt:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
      required:
        - id
        - executionId
        - kind
        - title
        - payload
        - createdAt
    ActionResponse:
      type: object
      properties:
        approved:
          type: boolean
        value:
          $ref: "#/components/schemas/JsonValue"
        metadata:
          $ref: "#/components/schemas/JsonObject"
    ArtifactList:
      type: object
      properties:
        artifacts:
          type: array
          items:
            $ref: "#/components/schemas/Artifact"
      required:
        - artifacts
    Artifact:
      type: object
      properties:
        id:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        mediaType:
          type: string
          minLength: 1
        uri:
          type: string
          minLength: 1
        metadata:
          $ref: "#/components/schemas/JsonObject"
        executionId:
          type: string
          minLength: 1
        createdAt:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
      required:
        - id
        - name
        - mediaType
        - metadata
        - executionId
        - createdAt
    CancelExecutionRequest:
      type: object
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
    Conversation:
      type: object
      properties:
        id:
          type: string
          minLength: 1
        createdAt:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
        metadata:
          $ref: "#/components/schemas/JsonObject"
      required:
        - id
        - createdAt
        - metadata
    CreateArtifactInput:
      type: object
      properties:
        id:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        mediaType:
          type: string
          minLength: 1
        uri:
          type: string
          minLength: 1
        metadata:
          $ref: "#/components/schemas/JsonObject"
      required:
        - id
        - name
        - mediaType
    CreateConversationRequest:
      type: object
      properties:
        metadata:
          $ref: "#/components/schemas/JsonObject"
    EventList:
      type: object
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/RuntimeEvent"
        nextCursor:
          type: integer
          minimum: 0
          maximum: 9007199254740991
      required:
        - events
        - nextCursor
    ExecutionError:
      type: object
      properties:
        code:
          type: string
          minLength: 1
        message:
          type: string
          minLength: 1
      required:
        - code
        - message
    Execution:
      type: object
      properties:
        id:
          type: string
          minLength: 1
        conversationId:
          type: string
          minLength: 1
        providerId:
          type: string
          minLength: 1
        state:
          $ref: "#/components/schemas/ExecutionState"
        input:
          type: string
        requiredCapabilities:
          type: array
          items:
            type: string
            minLength: 1
        effectiveConfig:
          $ref: "#/components/schemas/JsonObject"
        createdAt:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
        updatedAt:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
        startedAt:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
        endedAt:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
        finalOutput:
          type: string
        error:
          $ref: "#/components/schemas/ExecutionError"
      required:
        - id
        - conversationId
        - providerId
        - state
        - input
        - requiredCapabilities
        - effectiveConfig
        - createdAt
        - updatedAt
    ExecutionState:
      type: string
      enum:
        - queued
        - starting
        - running
        - awaiting_input
        - awaiting_approval
        - cancelling
        - succeeded
        - failed
        - cancelled
    JsonObject:
      type: object
      propertyNames:
        type: string
      additionalProperties:
        $ref: "#/components/schemas/JsonValue"
    JsonValue:
      anyOf:
        - type: string
        - type: number
        - type: boolean
        - type: "null"
        - type: array
          items:
            $ref: "#/components/schemas/JsonValue"
        - type: object
          propertyNames:
            type: string
          additionalProperties:
            $ref: "#/components/schemas/JsonValue"
    Problem:
      type: object
      properties:
        code:
          type: string
          minLength: 1
        message:
          type: string
          minLength: 1
        details:
          $ref: "#/components/schemas/JsonObject"
      required:
        - code
        - message
    ProviderManifest:
      type: object
      properties:
        id:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        version:
          type: string
          minLength: 1
        protocolVersion:
          type: string
          const: 2026-09-02
        topologies:
          minItems: 1
          type: array
          items:
            $ref: "#/components/schemas/RuntimeTopology"
        capabilities:
          type: object
          propertyNames:
            type: string
            minLength: 1
          additionalProperties:
            $ref: "#/components/schemas/SupportLevel"
        metadata:
          $ref: "#/components/schemas/JsonObject"
      required:
        - id
        - name
        - version
        - protocolVersion
        - topologies
        - capabilities
    RuntimeDescription:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        version:
          type: string
          minLength: 1
        protocolVersion:
          type: string
          const: 2026-09-02
        providers:
          type: array
          items:
            $ref: "#/components/schemas/ProviderManifest"
      required:
        - name
        - version
        - protocolVersion
        - providers
    RuntimeEvent:
      type: object
      properties:
        id:
          type: string
          minLength: 1
        executionId:
          type: string
          minLength: 1
        sequence:
          type: integer
          exclusiveMinimum: 0
          maximum: 9007199254740991
        type:
          $ref: "#/components/schemas/StandardEventType"
        time:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
        data:
          $ref: "#/components/schemas/JsonObject"
      required:
        - id
        - executionId
        - sequence
        - type
        - time
        - data
    RuntimeTopology:
      type: string
      enum:
        - embedded
        - subprocess
        - remote
    StandardEventType:
      type: string
      enum:
        - run.queued
        - run.started
        - output.text.delta
        - output.text.done
        - action.required
        - action.responded
        - artifact.created
        - provider.event
        - run.completed
        - run.failed
        - run.cancelled
    StartExecutionRequest:
      type: object
      properties:
        conversationId:
          type: string
          minLength: 1
        providerId:
          type: string
          minLength: 1
        input:
          type: string
        requiredCapabilities:
          type: array
          items:
            type: string
            minLength: 1
        config:
          $ref: "#/components/schemas/JsonObject"
        idempotencyKey:
          type: string
          minLength: 1
          maxLength: 200
      required:
        - conversationId
        - providerId
        - input
    SupportLevel:
      type: string
      enum:
        - native
        - emulated
        - degraded
        - unsupported
