<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">执行生命周期</title>
<desc id="desc">运行及等待期间的 Provider 错误都可进入失败终态；所有非终态均可发起取消。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#59616d"/></marker>
<style>
text { font-family: Inter, "PingFang SC", system-ui, sans-serif; text-anchor: middle; fill: #20242b; }
.title { font-size: 48px; font-weight: 700; }
.label { font-size: 25px; font-weight: 650; }
.small { font-size: 20px; fill: #59616d; }
.node { fill: #fff; stroke: #59616d; stroke-width: 3; rx: 8; }
.active { stroke: #1473e6; } .wait { stroke: #b66b00; }
.edge { fill: none; stroke: #59616d; stroke-width: 3; marker-end: url(#arrow); }
</style></defs>
<rect width="1600" height="900" fill="#fff"/>
<text x="800" y="66" class="title">执行生命周期</text>
<text x="800" y="104" class="small">一次有界执行，只产生一个终态结果</text>
<rect data-state="queued" x="60" y="140" width="180" height="80" class="node active"/><text x="150" y="176" class="label">queued</text><text x="150" y="207" class="small">排队</text>
<rect data-state="starting" x="300" y="140" width="180" height="80" class="node active"/><text x="390" y="176" class="label">starting</text><text x="390" y="207" class="small">启动</text>
<rect data-state="running" x="540" y="140" width="200" height="80" class="node active"/><text x="640" y="176" class="label">running</text><text x="640" y="207" class="small">运行</text>
<rect data-state="succeeded" x="1260" y="140" width="240" height="80" class="node "/><text x="1380" y="176" class="label">succeeded</text><text x="1380" y="207" class="small">成功</text>
<rect data-state="awaiting_input" x="350" y="360" width="250" height="80" class="node wait"/><text x="475" y="396" class="label">awaiting_input</text><text x="475" y="427" class="small">等待输入</text>
<rect data-state="awaiting_approval" x="690" y="360" width="290" height="80" class="node wait"/><text x="835" y="396" class="label">awaiting_approval</text><text x="835" y="427" class="small">等待审批</text>
<rect data-state="failed" x="1260" y="360" width="240" height="80" class="node "/><text x="1380" y="396" class="label">failed</text><text x="1380" y="427" class="small">失败</text>
<rect data-state="cancelling" x="670" y="650" width="240" height="90" class="node wait"/><text x="790" y="686" class="label">cancelling</text><text x="790" y="717" class="small">正在取消</text>
<rect data-state="cancelled" x="1260" y="650" width="240" height="90" class="node "/><text x="1380" y="686" class="label">cancelled</text><text x="1380" y="717" class="small">已取消</text>
<rect x="60" y="650" width="500" height="90" class="node wait"/>
<text x="310" y="690" class="label">发起取消</text>
<text x="310" y="722" class="small">适用于任意非终态</text>
<path data-from="queued" data-to="starting" d="M240 180 H300" class="edge"/>
<path data-from="starting" data-to="running" d="M480 180 H540" class="edge"/>
<path data-from="running" data-to="succeeded" d="M740 180 H1260" class="edge"/>
<path data-from="running" data-to="awaiting_input" d="M600 220 V300 H475 V360" class="edge"/>
<path data-from="awaiting_input" data-to="running" d="M430 360 V260 H560 V220" class="edge"/>
<path data-from="running" data-to="awaiting_approval" d="M680 220 V315 H835 V360" class="edge"/>
<path data-from="awaiting_approval" data-to="running" d="M930 360 V275 H720 V220" class="edge"/>
<path data-from="running" data-to="failed" d="M740 205 H1110 V400 H1260" class="edge"/>
<path data-from="awaiting_input" data-to="failed" d="M600 400 H640 V505 H1110 V400 H1260" class="edge"/>
<path data-from="awaiting_approval" data-to="failed" d="M980 400 H1260" class="edge"/>
<path data-from="any_nonterminal" data-to="cancelling" d="M560 695 H670" class="edge"/>
<path data-from="cancelling" data-to="cancelled" d="M910 695 H1260" class="edge"/>
<text x="990" y="164" class="small">执行完成</text>
<text x="430" y="248" class="small">响应恢复</text>
<text x="515" y="332" class="small">请求输入</text>
<text x="880" y="261" class="small">响应恢复</text>
<text x="740" y="342" class="small">请求审批</text>
<text x="1380" y="478" class="small">Provider 错误</text>
<text x="1380" y="508" class="small">运行或等待期间均可失败</text>
<text x="800" y="832" class="small">终态不会返回活动状态；取消流程拥有其最终取消结果。</text>
</svg>
