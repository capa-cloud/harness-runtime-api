<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Portable Execution Lifecycle</title>
<desc id="desc">Provider failures can end running or awaiting states; cancellation applies to every non-terminal state.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#59616d"/></marker>
<style>
text { font-family: Inter, "PingFang SC", system-ui, sans-serif; text-anchor: middle; fill: #20242b; }
.title { font-size: 48px; font-weight: 700; }
.label { font-size: 25px; font-weight: 650; }
.small { font-size: 20px; fill: #59616d; }
.node { fill: #fff; stroke: #59616d; stroke-width: 3; rx: 8; }
.active { stroke: #1473e6; } .wait { stroke: #b66b00; }
.edge { fill: none; stroke: #59616d; stroke-width: 3; marker-end: url(#arrow); }
</style></defs>
<rect width="1600" height="900" fill="#fff"/>
<text x="800" y="66" class="title">Portable Execution Lifecycle</text>
<text x="800" y="104" class="small">One bounded attempt, one terminal outcome</text>
<rect data-state="queued" x="60" y="140" width="180" height="80" class="node active"/><text x="150" y="189" class="label">queued</text>
<rect data-state="starting" x="300" y="140" width="180" height="80" class="node active"/><text x="390" y="189" class="label">starting</text>
<rect data-state="running" x="540" y="140" width="200" height="80" class="node active"/><text x="640" y="189" class="label">running</text>
<rect data-state="succeeded" x="1260" y="140" width="240" height="80" class="node "/><text x="1380" y="189" class="label">succeeded</text>
<rect data-state="awaiting_input" x="350" y="360" width="250" height="80" class="node wait"/><text x="475" y="409" class="label">awaiting_input</text>
<rect data-state="awaiting_approval" x="690" y="360" width="290" height="80" class="node wait"/><text x="835" y="409" class="label">awaiting_approval</text>
<rect data-state="failed" x="1260" y="360" width="240" height="80" class="node "/><text x="1380" y="409" class="label">failed</text>
<rect data-state="cancelling" x="670" y="650" width="240" height="90" class="node wait"/><text x="790" y="699" class="label">cancelling</text>
<rect data-state="cancelled" x="1260" y="650" width="240" height="90" class="node "/><text x="1380" y="699" class="label">cancelled</text>
<rect x="60" y="650" width="500" height="90" class="node wait"/>
<text x="310" y="690" class="label">Cancel request</text>
<text x="310" y="722" class="small">from any non-terminal state</text>
<path data-from="queued" data-to="starting" d="M240 180 H300" class="edge"/>
<path data-from="starting" data-to="running" d="M480 180 H540" class="edge"/>
<path data-from="running" data-to="succeeded" d="M740 180 H1260" class="edge"/>
<path data-from="running" data-to="awaiting_input" d="M600 220 V300 H475 V360" class="edge"/>
<path data-from="awaiting_input" data-to="running" d="M430 360 V260 H560 V220" class="edge"/>
<path data-from="running" data-to="awaiting_approval" d="M680 220 V315 H835 V360" class="edge"/>
<path data-from="awaiting_approval" data-to="running" d="M930 360 V275 H720 V220" class="edge"/>
<path data-from="running" data-to="failed" d="M740 205 H1110 V400 H1260" class="edge"/>
<path data-from="awaiting_input" data-to="failed" d="M600 400 H640 V505 H1110 V400 H1260" class="edge"/>
<path data-from="awaiting_approval" data-to="failed" d="M980 400 H1260" class="edge"/>
<path data-from="any_nonterminal" data-to="cancelling" d="M560 695 H670" class="edge"/>
<path data-from="cancelling" data-to="cancelled" d="M910 695 H1260" class="edge"/>
<text x="990" y="164" class="small">completed</text>
<text x="430" y="248" class="small">response</text>
<text x="515" y="332" class="small">request</text>
<text x="880" y="261" class="small">response</text>
<text x="740" y="342" class="small">request</text>
<text x="1380" y="478" class="small">Provider failure</text>
<text x="1380" y="508" class="small">running or awaiting</text>
<text x="800" y="832" class="small">Terminal states never return to active states. Cancellation owns its terminal outcome.</text>
</svg>
